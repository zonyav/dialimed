name: Сборка exe

# Запускается двумя способами:
#   1) вы создаёте тег версии:  git tag v1.0.1 && git push origin v1.0.1
#   2) вручную: вкладка Actions -> «Сборка exe» -> Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Проверки
        run: python tests/t_check.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Записать версию и адрес репозитория в сборку
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d') { $tag = "dev-$($env:GITHUB_RUN_NUMBER)" }
          $version = $tag -replace '^v', ''
          "VERSION = '$version'"                     | Out-File app/_build.py -Encoding utf8
          "REPO = '${{ github.repository }}'"        | Out-File app/_build.py -Encoding utf8 -Append
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Собрать exe
        run: python -m PyInstaller --noconfirm Medizdeliya.spec

      # Имя файла не зависит от версии: программа обновляется подменой самой
      # себя, и ярлык у коллеги обязан пережить обновление. Версию видно в
      # названии релиза и в самой программе, в имени файла она только мешает.
      - name: Приложить файл к сборке
        uses: actions/upload-artifact@v4
        with:
          name: Medizdeliya-${{ env.VERSION }}
          path: dist/Medizdeliya.exe

      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Medizdeliya.exe
          generate_release_notes: true
